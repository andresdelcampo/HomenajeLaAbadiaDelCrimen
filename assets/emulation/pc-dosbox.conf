# Original disk bytes; speed is controlled by the emulator only.
[dosbox]
machine=cga
memsize=0
memsizekb=640
isa bus clock=std4.77

[cpu]
core=normal
cputype=8086
cycles=fixed 1200

[dos]
xms=false
ems=false
umb=false
# Bytes per second, including INT 13h reads made by the boot loader.
floppy drive data rate limit=32000

[speaker]
pcspeaker=true

[sblaster]
sbtype=none

[mixer]
rate=44100

[autoexec]
mount c .
c:
boot disk.ima
